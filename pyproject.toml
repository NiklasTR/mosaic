[project]
name = "mosaic"
version = "0.1.0"
description = "composite objective protein design"
readme = "README.md"
authors = [
    { name = "Nick Boyd", email = "nick@escalante.bio" }
]
requires-python = "==3.13.*"
dependencies = [
    "biopython>=1.84",
    "biotite>=1.2",
    "dm-haiku>=0.0.13",
    "dm-tree>=0.1.9",
    "equinox>=0.13.0",
    "gemmi>=0.6.5",
    "httpx>=0.28.1",
    "jax>=0.9.0",
    "joltz",
    "ml-collections>=1.0.0",
    "numpy>=1.26,<2.2",
    "optax>=0.2.4",
    "scipy>=1.15.3",
    "torch>=2.7.1",
    "torchvision>=0.22.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
boltzgen = [
    "joltzgen",
]
esm2 = [
    "esm2quinox==0.1.0",
]
esmc = [
    "esmj",
]
ablang = [
    "ablang>=0.3.1",
    "jablang",
]
notebooks = [
    "ipymolstar>=0.0.9",
    "marimo>=0.10.9",
    "matplotlib>=3.10.0",
]
hydra = [
    "hydra-colorlog==1.2.0",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
]
# Omits esmc: conflicts with esm2 under [tool.uv.conflicts]; use --extra esmc when needed instead.
all = [
    "joltzgen",
    "esm2quinox==0.1.0",
    "ablang>=0.3.1",
    "jablang",
    "ipymolstar>=0.0.9",
    "marimo>=0.10.9",
    "matplotlib>=3.10.0",
    "hydra-colorlog==1.2.0",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
]

# jax-cuda: CUDA 13 JAX (same convention as packages/thermax optional cuda13).
# jax-cpu: CPU-only / login nodes.
[dependency-groups]
jax-cpu = [
  "jax[cpu]",
]
jax-cuda = [
  "jax[cuda13]>=0.9.0",
]
jax-tpu= [
  "jax[tpu]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/mosaic/proteinmpnn/weights/*",
]

# Torch wheels: pathfinder workspace root sets `torch`/`torchvision` to `pytorch-cu130` on Linux/Win.
[tool.uv.sources]
joltz = { git = "https://github.com/nboyd/joltz" }
esmj = { git = "https://github.com/escalante-bio/esmj" }
jablang = { git = "https://github.com/escalante-bio/jablang" }
joltzgen = { git = "https://github.com/escalante-bio/joltzgen.git" }

[tool.uv]
conflicts = [
    [
      { group = "jax-cpu" },
      { group = "jax-cuda" },
      { group = "jax-tpu" },
    ],
    [
      { extra = "esm2" },
      { extra = "esmc" },
    ],
]
package = true
# boltz (via joltz) pins scipy==1.13.1; mosaic stack uses scipy>=1.15.3.
# These overrides apply when this directory is the uv project (uv sync here, or uv pip install --project packages/mosaic).
override-dependencies = ["scipy>=1.15.3", "numpy>=1.26,<2.2", "gemmi>=0.7", "biotite>=1.2"]
