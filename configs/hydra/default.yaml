# https://hydra.cc/docs/configure_hydra/intro/
# Shared Hydra behavior for mosaic (mirrors packages/thermax/configs/hydra/default.yaml).

defaults:
  - override hydra_logging: colorlog
  - override job_logging: colorlog

run:
  dir: logs/mosaic/${task_name}/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}
sweep:
  dir: logs/mosaic/${task_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
  subdir: ${hydra.job.num}

job:
  chdir: true

job_logging:
  handlers:
    file:
      filename: ${hydra.runtime.output_dir}/${task_name}.log
